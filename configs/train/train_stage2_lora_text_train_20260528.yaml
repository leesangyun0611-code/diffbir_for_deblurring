model:
  cldm:
    target: diffbir.model.cldm.ControlLDM
    params:
      latent_scale_factor: 0.18215
      unet_cfg:
        use_checkpoint: True
        image_size: 32
        in_channels: 4
        out_channels: 4
        model_channels: 320
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_head_channels: 64
        use_spatial_transformer: True
        use_linear_in_transformer: True
        transformer_depth: 1
        context_dim: 1024
        legacy: False
      vae_cfg:
        embed_dim: 4
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [1, 2, 4, 4]
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
      clip_cfg:
        embed_dim: 1024
        vision_cfg:
          image_size: 224
          layers: 32
          width: 1280
          head_width: 80
          patch_size: 14
        text_cfg:
          context_length: 77
          vocab_size: 49408
          width: 1024
          heads: 16
          layers: 24
        layer: "penultimate"
      controlnet_cfg:
        use_checkpoint: True
        image_size: 32
        in_channels: 4
        hint_channels: 4
        model_channels: 320
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_head_channels: 64
        use_spatial_transformer: True
        use_linear_in_transformer: True
        transformer_depth: 1
        context_dim: 1024
        legacy: False

  swinir:
    target: diffbir.model.swinir.SwinIR
    params:
      img_size: 64
      patch_size: 1
      in_chans: 3
      embed_dim: 180
      depths: [6, 6, 6, 6, 6, 6, 6, 6]
      num_heads: [6, 6, 6, 6, 6, 6, 6, 6]
      window_size: 8
      mlp_ratio: 2
      sf: 8
      img_range: 1.0
      upsampler: "nearest+conv"
      resi_connection: "1conv"
      unshuffle: True
      unshuffle_scale: 8

  diffusion:
    target: diffbir.model.gaussian_diffusion.Diffusion
    params:
      linear_start: 0.00085
      linear_end: 0.0120
      timesteps: 1000
      zero_snr: True
      parameterization: v

dataset:
  train:
    target: diffbir.dataset.paired.PairedImageDataset
    params:
      lq_dir: text_train
      gt_dir: text_train_GT
      out_size: 512
      crop_type: random
      prompt: ""
      p_empty_prompt: 1.0

batch_transform:
  target: diffbir.dataset.paired.PairedIdentityBatchTransform

train:
  sd_path: weights/sd2.1-base-zsnr-laionaes5.ckpt
  resume: weights/DiffBIR_v2.1.pt
  lora_resume: experiments/stage2_lora_paired_20260528/checkpoints/lora_final.pt
  swinir_path: weights/realesrgan_s4_swinir_100k.pth
  exp_dir: experiments/stage2_lora_text_train_20260528
  learning_rate: 1e-4
  weight_decay: 0.0
  batch_size: 2
  num_workers: 0
  train_steps: 2000
  log_every: 10
  ckpt_every: 500
  image_every: 500
  num_log_images: 1
  sample_steps: 25
  noise_aug_timestep: 200
  lora:
    rank: 8
    alpha: 8
    dropout: 0.05
    use_conv: false
    target_modules:
      - attn1
      - attn2
      - ff
      - proj_in
      - proj_out
